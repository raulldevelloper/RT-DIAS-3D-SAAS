services:
  - type: web
    name: rtdias3d-api
    runtime: java
    rootDir: rtdias3d
    buildCommand: chmod +x mvnw && ./mvnw package -DskipTests
    startCommand: java -jar target/rtdias3d-0.0.1-SNAPSHOT.jar
    healthCheckPath: /actuator/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_SECRET
        generateValue: true
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false
